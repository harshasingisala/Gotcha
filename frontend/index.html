<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Found | Verified campus lost-and-found</title>
    <meta name="description" content="Campus Found helps students report, match, verify, and recover lost items with private handoffs and admin-reviewed claims." />
    <meta name="theme-color" content="#002452" />
    <meta property="og:title" content="Campus Found" />
    <meta property="og:description" content="A verified recovery system for campus lost-and-found reports, claims, matches, and handoffs." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-campus-found.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #f7fbff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .app-skeleton { min-height: 100vh; padding: 18px; color: #111c2d; background: radial-gradient(circle at top left, rgba(253, 118, 26, 0.10), transparent 24rem), radial-gradient(circle at 80% 10%, rgba(59, 130, 246, 0.12), transparent 26rem), linear-gradient(180deg, #f8fbff 0%, #f3f7ff 48%, #ffffff 100%); }
      .app-skeleton__inner { width: min(100%, 1120px); margin: 0 auto; }
      .app-skeleton__header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0 18px; }
      .app-skeleton__brand { display: flex; align-items: center; gap: 10px; color: #002452; font-size: 18px; font-weight: 800; }
      .app-skeleton__mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 10px; background: #fd761a; color: #fff; font-size: 13px; }
      .app-skeleton__pill { width: 112px; height: 34px; border-radius: 999px; background: #ffffff; box-shadow: 0 4px 12px rgba(0, 36, 82, 0.05); }
      .app-skeleton__hero { border: 1px solid rgba(196, 198, 208, 0.62); border-radius: 14px; background: linear-gradient(135deg, #ffffff 0%, #eef6ff 52%, #fff7ed 100%); padding: 22px; box-shadow: 0 18px 45px rgba(17, 28, 45, 0.08); }
      .app-skeleton__line { height: 14px; border-radius: 999px; background: linear-gradient(90deg, #e8eef7 0%, #fff 50%, #e8eef7 100%); background-size: 220% 100%; animation: skeleton-shimmer 1.1s ease-in-out infinite; }
      .app-skeleton__line--eyebrow { width: 150px; height: 10px; }
      .app-skeleton__line--title { width: min(100%, 420px); height: 34px; margin-top: 16px; }
      .app-skeleton__line--copy { width: min(100%, 560px); margin-top: 14px; }
      .app-skeleton__filters { display: flex; gap: 10px; overflow: hidden; margin: 18px 0; }
      .app-skeleton__filter { flex: 0 0 86px; height: 38px; border-radius: 999px; background: #ffffff; box-shadow: 0 4px 12px rgba(0, 36, 82, 0.05); }
      .app-skeleton__grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .app-skeleton__card { min-height: 250px; border: 1px solid rgba(231, 238, 255, 0.92); border-radius: 14px; background: #ffffff; padding: 14px; box-shadow: 0 4px 12px rgba(0, 36, 82, 0.05); }
      .app-skeleton__thumb { aspect-ratio: 4 / 3; border-radius: 10px; background: linear-gradient(90deg, #eef3ff 0%, #ffffff 50%, #eef3ff 100%); background-size: 220% 100%; animation: skeleton-shimmer 1.1s ease-in-out infinite; }
      .app-skeleton__card .app-skeleton__line { margin-top: 14px; }
      @keyframes skeleton-shimmer { 0% { background-position: 0 0; } 100% { background-position: -220% 0; } }
      @media (max-width: 720px) {
        .app-skeleton { padding: 14px; }
        .app-skeleton__grid { grid-template-columns: 1fr; }
        .app-skeleton__hero { padding: 18px; }
        .app-skeleton__line--title { height: 28px; }
        .app-skeleton__pill { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-skeleton" class="app-skeleton" aria-hidden="true">
      <div class="app-skeleton__inner">
        <header class="app-skeleton__header">
          <div class="app-skeleton__brand">
            <span class="app-skeleton__mark">CL</span>
            <span>Campus Lost</span>
          </div>
          <div class="app-skeleton__pill"></div>
        </header>
        <section class="app-skeleton__hero">
          <div class="app-skeleton__line app-skeleton__line--eyebrow"></div>
          <div class="app-skeleton__line app-skeleton__line--title"></div>
          <div class="app-skeleton__line app-skeleton__line--copy"></div>
        </section>
        <div class="app-skeleton__filters">
          <div class="app-skeleton__filter"></div>
          <div class="app-skeleton__filter"></div>
          <div class="app-skeleton__filter"></div>
          <div class="app-skeleton__filter"></div>
        </div>
        <section class="app-skeleton__grid">
          <article class="app-skeleton__card">
            <div class="app-skeleton__thumb"></div>
            <div class="app-skeleton__line"></div>
            <div class="app-skeleton__line app-skeleton__line--copy"></div>
          </article>
          <article class="app-skeleton__card">
            <div class="app-skeleton__thumb"></div>
            <div class="app-skeleton__line"></div>
            <div class="app-skeleton__line app-skeleton__line--copy"></div>
          </article>
          <article class="app-skeleton__card">
            <div class="app-skeleton__thumb"></div>
            <div class="app-skeleton__line"></div>
            <div class="app-skeleton__line app-skeleton__line--copy"></div>
          </article>
        </section>
      </div>
    </div>
    <div id="root"></div>
    <noscript>Campus Found needs JavaScript enabled to report, match, and recover items.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
